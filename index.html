<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabaran PJPK Tahun 6 - Aras Sederhana</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef7ff,#f8fbff);color:#172033}
.wrap{max-width:760px;margin:auto;padding:18px}.head,.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 7px 25px rgba(30,60,100,.12)}
.head{text-align:center;margin-bottom:16px}h1{margin:8px 0;font-size:28px}.sub{color:#65738a}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{background:#edf4ff;padding:9px 13px;border-radius:12px;font-weight:700}.progress{height:9px;background:#e5e9ef;border-radius:9px;overflow:hidden;margin:18px 0}
.bar{height:100%;width:0;background:#246bce;transition:.3s}.topic{font-size:13px;color:#246bce;font-weight:800;text-transform:uppercase}
.question{font-size:21px;line-height:1.45;margin:9px 0 17px}.opt{width:100%;text-align:left;padding:14px;margin:7px 0;border:2px solid #e1e6ed;border-radius:13px;background:white;font-size:16px;cursor:pointer}
.opt:hover{border-color:#246bce;background:#f6f9ff}.opt.correct{border-color:#159447;background:#eaf8ef}.opt.wrong{border-color:#d33;background:#fff0f0}.opt:disabled{cursor:default}
.feedback{min-height:42px;padding:10px 0;font-weight:700}.btn{border:0;background:#246bce;color:white;border-radius:13px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}
.hidden{display:none}.result{text-align:center}.big{font-size:48px}.review{text-align:left;margin-top:20px}.review div{padding:10px;border-bottom:1px solid #e5e7eb}
@media(max-width:520px){h1{font-size:23px}.question{font-size:19px}.wrap{padding:10px}.head,.card{padding:17px}}
</style></head>
<body><div class="wrap">
<div class="head"><div>🎮 <b>PJ & PENDIDIKAN KESIHATAN</b></div><h1>Cabaran Juara Sihat — Aras Sederhana</h1><div class="sub">Tahun 6 • 30 Soalan</div></div>
<div id="game" class="card"><div class="top"><div class="pill" id="counter"></div><div class="pill" id="score">Skor: 0</div></div>
<div class="progress"><div class="bar" id="bar"></div></div><div class="topic" id="topic"></div><div class="question" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button id="next" class="btn hidden">Soalan Seterusnya ➜</button></div>
<div id="result" class="card result hidden"></div></div>
<script>
const questions=[{t:"PJ",q:"Apakah tujuan utama melakukan aktiviti memanaskan badan sebelum permainan?",o:["Menyediakan otot dan sendi untuk aktiviti","Menyebabkan badan cepat letih","Mengurangkan kadar pernafasan","Menggantikan waktu rehat"],a:0},{t:"PJ",q:"Semasa melakukan larian berterusan, apakah perubahan yang paling mungkin berlaku pada kadar denyutan nadi?",o:["Menurun dengan banyak","Meningkat","Tidak berubah langsung","Berhenti seketika"],a:1},{t:"PJ",q:"Ali ingin meningkatkan daya tahan kardiovaskular. Aktiviti manakah paling sesuai dilakukan secara berkala?",o:["Jalan santai selama 2 minit sahaja","Joging selama 20 minit","Duduk selama 20 minit","Regangan tangan selama 1 minit"],a:1},{t:"PJ",q:"Apakah tindakan yang paling sesuai jika rakan terjatuh dan mengalami kecederaan semasa permainan?",o:["Teruskan permainan","Menolak rakan supaya bangun","Hentikan aktiviti dan maklumkan kepada guru","Membiarkan rakan bersendirian"],a:2},{t:"PJ",q:"Dalam permainan bola jaring, mengapa pemain perlu bergerak mencari ruang kosong?",o:["Supaya mudah menerima hantaran","Supaya boleh keluar gelanggang","Supaya tidak perlu bekerjasama","Supaya permainan menjadi perlahan"],a:0},{t:"PJ",q:"Apakah kemahiran yang paling penting apabila menerima hantaran bola?",o:["Memalingkan muka daripada bola","Memberi perhatian dan bersedia menerima bola","Menutup mata","Berdiri membelakangi rakan"],a:1},{t:"PJ",q:"Apakah contoh latihan yang dapat meningkatkan kekuatan otot bahagian atas badan?",o:["Tekan tubi","Berjalan perlahan","Duduk membaca","Membuat pernafasan sahaja"],a:0},{t:"PJ",q:"Mengapakah teknik mendarat dengan lutut sedikit dibengkokkan penting selepas melompat?",o:["Mengurangkan hentakan pada sendi","Menambahkan risiko kecederaan","Menyebabkan badan hilang imbangan","Supaya boleh berhenti berlari"],a:0},{t:"PJ",q:"Semasa melakukan aktiviti fizikal dalam cuaca panas, apakah tindakan yang wajar?",o:["Minum air secukupnya dan berehat apabila perlu","Tidak minum air","Memakai pakaian yang terlalu tebal","Terus bersukan tanpa rehat"],a:0},{t:"PJ",q:"Apakah maksud kelenturan dalam kecergasan fizikal?",o:["Keupayaan sendi bergerak dalam julat pergerakan yang sesuai","Keupayaan berlari paling laju","Keupayaan mengangkat beban paling berat","Keupayaan menahan lapar"],a:0},{t:"PJ",q:"Dalam permainan berpasukan, apakah contoh kerjasama yang baik?",o:["Menguasai bola sepanjang permainan","Memberi hantaran kepada rakan yang berada pada kedudukan sesuai","Menyalahkan rakan apabila kalah","Mengabaikan arahan pasukan"],a:1},{t:"PJ",q:"Mengapakah penyejukan badan dilakukan selepas aktiviti fizikal?",o:["Membantu badan kembali secara beransur-ansur kepada keadaan rehat","Meningkatkan kecederaan","Menyebabkan denyutan nadi terus meningkat","Menggantikan keperluan tidur"],a:0},{t:"PJ",q:"Jika seorang murid berasa sakit dada dan sukar bernafas ketika bersukan, apakah tindakan paling selamat?",o:["Teruskan bermain","Berhenti dan segera maklumkan kepada guru","Minum minuman bergas dan sambung bermain","Berlari lebih laju"],a:1},{t:"PJ",q:"Apakah faktor yang paling membantu seseorang meningkatkan kecergasan fizikal?",o:["Latihan yang konsisten dan pemakanan seimbang","Bersukan sekali setahun","Tidak tidur secukupnya","Tidak mengambil sarapan"],a:0},{t:"PJ",q:"Mengapakah kasut sukan yang sesuai penting ketika melakukan aktiviti fizikal?",o:["Memberikan sokongan dan membantu mengurangkan risiko kecederaan","Menjadikan seseorang lebih tinggi","Menjamin kemenangan","Menggantikan pemanasan badan"],a:0},{t:"PK",q:"Mengapakah pengambilan pelbagai jenis makanan diperlukan dalam diet harian?",o:["Badan mendapat pelbagai nutrien yang diperlukan","Supaya boleh makan makanan manis sahaja","Supaya tidak perlu minum air","Supaya tidak perlu bersenam"],a:0},{t:"PK",q:"Apakah pilihan makanan yang lebih baik untuk hidangan tengah hari yang seimbang?",o:["Nasi, ikan, sayur dan buah","Kentang goreng dan minuman manis sahaja","Gula-gula dan minuman berkarbonat","Kerepek sahaja"],a:0},{t:"PK",q:"Mengapakah kita perlu membaca label pemakanan pada makanan yang dibungkus?",o:["Untuk membuat pilihan berdasarkan kandungan nutrien","Untuk mengetahui warna kegemaran pengeluar","Untuk memilih bungkusan terbesar sahaja","Untuk mengelakkan semua makanan berbungkus"],a:0},{t:"PK",q:"Apakah kesan jika seseorang kerap mengambil minuman tinggi gula?",o:["Boleh meningkatkan risiko kerosakan gigi dan masalah berat badan","Menjadikan gigi semakin kuat","Meningkatkan kecergasan secara automatik","Menggantikan keperluan air kosong"],a:0},{t:"PK",q:"Apakah amalan yang paling membantu mencegah penyebaran kuman?",o:["Mencuci tangan dengan betul pada waktu yang sesuai","Berkongsi tuala dengan semua rakan","Tidak menutup mulut ketika batuk","Menggunakan barang peribadi orang lain"],a:0},{t:"PK",q:"Apakah tindakan yang sesuai apabila mengalami tekanan kerana tugasan sekolah?",o:["Menyusun tugasan, berehat secukupnya dan berbincang dengan orang dipercayai","Memendam masalah","Tidak tidur sehingga tugasan selesai","Marah kepada rakan"],a:0},{t:"PK",q:"Mengapa tidur yang mencukupi penting kepada murid?",o:["Membantu pemulihan badan dan meningkatkan tumpuan","Menyebabkan murid tidak perlu belajar","Menggantikan semua aktiviti fizikal","Menghapuskan keperluan sarapan"],a:0},{t:"PK",q:"Apakah tindakan yang wajar jika menerima mesej daripada orang tidak dikenali yang meminta maklumat peribadi?",o:["Jangan berikan maklumat dan maklumkan kepada orang dewasa dipercayai","Berikan nama penuh dan alamat","Hantar gambar peribadi","Ajak orang itu berjumpa"],a:0},{t:"PK",q:"Apakah contoh maklumat peribadi yang perlu dijaga ketika menggunakan internet?",o:["Alamat rumah dan kata laluan","Nama haiwan kesayangan sahaja","Warna kegemaran","Makanan kegemaran"],a:0},{t:"PK",q:"Apakah tindakan yang paling sesuai jika melihat rakan dibuli?",o:["Membantu dengan cara yang selamat dan melaporkan kepada guru","Menyertai pembuli","Merakam dan menyebarkan video","Membalas dengan keganasan"],a:0},{t:"PK",q:"Mengapa seseorang perlu menghormati batas diri dan orang lain?",o:["Untuk menjaga keselamatan, maruah dan keselesaan setiap individu","Supaya boleh memaksa orang lain","Supaya semua orang perlu mengikut kehendak kita","Supaya masalah dapat disembunyikan"],a:0},{t:"PK",q:"Apakah tindakan yang betul jika seseorang menyentuh bahagian tubuh yang membuat kita berasa tidak selesa?",o:["Menjauhkan diri dan memberitahu orang dewasa yang dipercayai","Menyimpan perkara itu sebagai rahsia","Menganggapnya sebagai gurauan","Membenarkan perkara itu berulang"],a:0},{t:"PK",q:"Apakah pilihan terbaik untuk mengekalkan gaya hidup sihat?",o:["Aktif secara fizikal, makan seimbang, tidur cukup dan menjaga kebersihan","Bersukan sahaja tanpa menjaga pemakanan","Tidur sepanjang hari","Mengambil makanan segera setiap hari"],a:0},{t:"PK",q:"Mengapakah pengurusan masa penting kepada murid?",o:["Membantu mengimbangi masa belajar, aktiviti fizikal, rehat dan tanggungjawab","Supaya boleh bermain sepanjang hari","Supaya tidak perlu merancang","Supaya tidur lebih lewat"],a:0},{t:"PK",q:"Jika rakan mengajak melakukan cabaran media sosial yang berbahaya, apakah keputusan terbaik?",o:["Menolak cabaran dan menjelaskan bahawa keselamatan lebih penting","Mengikut cabaran supaya tidak dianggap pengecut","Mengajak lebih ramai rakan","Merakam dahulu kemudian mencuba"],a:0}];
let n=0,score=0,answered=false,records=[];
const E=id=>document.getElementById(id);
function render(){answered=false;let q=questions[n];E("counter").textContent=`Soalan ${n+1} / 30`;E("score").textContent=`Skor: ${score}`;E("bar").style.width=`${(n+1)/30*100}%`;E("topic").textContent=q.t;E("question").textContent=q.q;E("feedback").textContent="";E("next").classList.add("hidden");let box=E("options");box.innerHTML="";
q.o.forEach((x,i)=>{let b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+i)+". "+x;b.onclick=()=>answer(i,b);box.appendChild(b)})}
function answer(i,btn){if(answered)return;answered=true;let q=questions[n];[...E("options").children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("correct")});if(i===q.a){score+=10;btn.classList.add("correct");E("feedback").textContent="✅ Betul! Jawapan anda tepat."}else{btn.classList.add("wrong");E("feedback").textContent="❌ Kurang tepat. Jawapan yang betul ialah "+q.o[q.a]+"."}E("score").textContent=`Skor: ${score}`;records.push(i===q.a);E("next").classList.remove("hidden")}
E("next").onclick=()=>{n++;if(n<30)render();else finish()};
function finish(){E("game").classList.add("hidden");E("result").classList.remove("hidden");let betul=records.filter(Boolean).length;let msg=betul>=27?"🏆 Cemerlang!":betul>=21?"🌟 Sangat baik!":betul>=15?"👍 Baik, teruskan usaha!":"💪 Cuba lagi untuk tingkatkan penguasaan!";
E("result").innerHTML=`<div class="big">🎉</div><h2>Permainan Tamat!</h2><p style="font-size:23px"><b>${score} / 300</b></p><p>${betul} daripada 30 jawapan betul.</p><p>${msg}</p><button class="btn" id="again">🔄 Main Semula</button>`;
E("again").onclick=()=>{n=0;score=0;records=[];E("result").classList.add("hidden");E("game").classList.remove("hidden");render();window.scrollTo(0,0)}}
render();
</script></body></html>
